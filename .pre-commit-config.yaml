repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-logger

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, pydantic-settings, sqlalchemy, psycopg, pgvector, sentence-transformers, transformers, peft, trl, bitsandbytes, accelerate, rank-bm25, xgboost, lightgbm, shap, scikit-learn, mlflow, typer, rich, structlog, python-dotenv, httpx, tenacity, sqlglot, outlines]
        args: [--strict, --show-error-codes]