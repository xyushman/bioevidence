# BioEvidence application configuration.
# Environment variables listed in .env.example override these defaults.

scope:
  therapeutic_areas:
    - name: oncology
      keywords: [cancer, tumor, neoplasm, carcinoma, lymphoma, leukemia, melanoma]
      mesh_terms: [Neoplasms]
    - name: inflammation_immunology
      keywords:
        - rheumatoid arthritis
        - psoriasis
        - inflammatory bowel disease
        - crohn
        - ulcerative colitis
      mesh_terms:
        - Arthritis, Rheumatoid
        - Psoriasis
        - Inflammatory Bowel Diseases
    - name: cardiovascular
      keywords: [heart failure, myocardial infarction, atrial fibrillation, hypertension]
      mesh_terms: [Cardiovascular Diseases]
    - name: bone_osteoporosis
      keywords: [osteoporosis, bone fracture, bone metastasis]
      mesh_terms: [Osteoporosis, Bone Diseases]
  condition_keywords:
    - cancer
    - tumor
    - neoplasm
    - rheumatoid arthritis
    - psoriasis
    - heart failure
    - hypertension
    - osteoporosis
  trial_filters:
    study_type: INTERVENTIONAL
    start_date_min: "2005-01-01"
  targets:
    trials: 25000
    pubmed_articles: 100000
    drug_labels: 4000

database:
  url: postgresql://bioevidence:bioevidence@localhost:5432/bioevidence
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30

llm:
  provider: gemini
  gemini:
    api_key: ""
    model: gemini-1.5-flash
    temperature: 0.0
    max_tokens: 8192
  anthropic:
    api_key: ""
    model: claude-3-haiku-20240307
    temperature: 0.0
    max_tokens: 4096
  openai:
    api_key: ""
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 4096
  cache_dir: data/processed/llm_cache

embedding:
  model: BAAI/bge-small-en-v1.5
  dimension: 384
  batch_size: 64
  normalize: true

reranker:
  model: BAAI/bge-reranker-base
  batch_size: 32

retrieval:
  system: A5
  top_k: 5
  candidate_pool: 50
  rrf_k: 60
  bm25_weight: 0.5
  dense_weight: 0.5

chunking:
  max_tokens: 512
  overlap: 32
  trial_section_overlap: 40
  label_section_overlap: 40

agent:
  max_steps: 6
  timeout_seconds: 30
  token_budget: 8000
  sql_timeout_seconds: 3
  sql_limit: 200

forecasting:
  test_start_year: 2020
  max_duration_months: 180
  min_duration_months: 1

api:
  host: 0.0.0.0
  port: 8000
  cors_origins: [http://localhost:5173]

rate_limits:
  ncbi: 3
  ncbi_api_key: ""
  openfda: 10

seed: 42

mlflow:
  tracking_uri: file:./mlruns
  experiment_name: bioevidence
