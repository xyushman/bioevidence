# Reranker fine-tuning configuration
model:
  base_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  output_dir: "models/minilm-reranker-ft"
  max_seq_length: 512

data:
  train_file: "data/processed/rerank_pairs.jsonl"
  num_pairs: 15000
  hard_negatives_per_query: 5
  negative_mining:
    source: "fine_tuned_retriever"
    rank_range: [1, 50]
    exclude_same_doc: true

training:
  loss: "BCEWithLogitsLoss"
  batch_size: 32
  gradient_accumulation_steps: 2
  learning_rate: 2e-5
  num_epochs: 2
  warmup_ratio: 0.1
  fp16: true
  bf16: false
  gradient_checkpointing: true
  seed: 42
  logging_steps: 50
  eval_steps: 500
  save_steps: 500
  save_total_limit: 2
  metric_for_best_model: "eval_accuracy"
  greater_is_better: true
  load_best_model_at_end: true
  report_to: "mlflow"

optimizer:
  type: "adamw_torch"
  weight_decay: 0.01

scheduler:
  type: "cosine"

eval:
  metrics:
    - "accuracy"
    - "f1"
    - "auc"
  latency_benchmark:
    batch_sizes: [1, 8, 16, 32]
    num_runs: 100