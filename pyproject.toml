[project]
name = "bioevidence"
version = "0.1.0"
description = "Biomedical Evidence Copilot: RAG + agent system over public biomedical data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "psycopg>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pgvector>=0.2",
    "sentence-transformers>=3.0",
    "transformers>=4.41",
    "peft>=0.11",
    "trl>=0.9",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
    "rank-bm25>=0.2",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "shap>=0.44",
    "scikit-learn>=1.5",
    "mlflow>=2.14",
    "numpy>=1.26",
    "pandas>=2.2",
    "tqdm>=4.66",
    "httpx>=0.27",
    "tenacity>=8.3",
    "sqlglot>=25.0",
    "outlines>=0.0.38",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "pre-commit>=3.7",
]
api = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "slowapi>=0.1",
    "prometheus-client>=0.19",
]
train = [
    "datasets>=2.19",
    "evaluate>=0.4",
    "wandb>=0.17",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "pre-commit>=3.7",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "SIM", "TID", "TRY"]
ignore = ["E501", "TRY003"]
fixable = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "SIM", "TID"]
unfixable = ["S", "E501"]
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/bioevidence"]
omit = ["*/tests/*", "*/conftest.py"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"